global:
  namespaceOverride: mistle
  imageRegistry: ghcr.io/mistlehq

controlPlaneApi:
  image:
    repository: control-plane-api
    digest: sha256:replace-with-control-plane-api-digest
  ingress:
    enabled: true
    className: nginx
    host: api.example.com
  env:
    - name: NODE_ENV
      value: production
    - name: MISTLE_TELEMETRY_ENABLED
      value: "true"
    - name: MISTLE_TELEMETRY_DEBUG
      value: "false"
    - name: MISTLE_TELEMETRY_TRACES_ENDPOINT
      value: http://otel-collector:4318/v1/traces
    - name: MISTLE_TELEMETRY_LOGS_ENDPOINT
      value: http://otel-collector:4318/v1/logs
    - name: MISTLE_TELEMETRY_METRICS_ENDPOINT
      value: http://otel-collector:4318/v1/metrics
    - name: MISTLE_TELEMETRY_RESOURCE_ATTRIBUTES
      value: deployment.environment=production
    - name: MISTLE_SANDBOX_PROVIDER
      value: docker
    - name: MISTLE_SANDBOX_DEFAULT_BASE_IMAGE
      value: ghcr.io/mistlehq/sandbox-base:0123456789abcdef
    # Set provider to e2b and supply the E2B API key secret below for cloud sandboxes.
    - name: MISTLE_SERVICES_DATA_PLANE_GATEWAY_SANDBOX_WS_PUBLIC_URL
      value: wss://gateway.example.com/tunnel/sandbox
    - name: MISTLE_SERVICES_DATA_PLANE_GATEWAY_SANDBOX_WS_INTERNAL_URL
      value: ws://mistle-data-plane-gateway:8084/tunnel/sandbox
    - name: MISTLE_SANDBOX_TOKENS_CONNECT_ISSUER
      value: control-plane-api
    - name: MISTLE_SANDBOX_TOKENS_CONNECT_AUDIENCE
      value: data-plane-gateway
    - name: MISTLE_SANDBOX_TOKENS_BOOTSTRAP_ISSUER
      value: data-plane-worker
    - name: MISTLE_SANDBOX_TOKENS_BOOTSTRAP_AUDIENCE
      value: data-plane-gateway
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_HOST
      value: 0.0.0.0
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_PORT
      value: "8080"
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_PUBLIC_URL
      value: https://api.example.com
    - name: MISTLE_SERVICES_DASHBOARD_PUBLIC_URL
      value: https://app.example.com
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_TRUSTED_ORIGINS
      value: https://app.example.com
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_OTP_LENGTH
      value: "6"
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_OTP_EXPIRES_IN_SECONDS
      value: "300"
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_OTP_ALLOWED_ATTEMPTS
      value: "3"
    - name: MISTLE_WORKFLOW_CONTROL_PLANE_NAMESPACE_ID
      value: production
    - name: MISTLE_SERVICES_DATA_PLANE_API_INTERNAL_URL
      value: http://mistle-data-plane-api:8082
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_INTEGRATIONS_ACTIVE_MASTER_ENCRYPTION_KEY_VERSION
      value: "1"
  secretEnv:
    - name: MISTLE_INTERNAL_AUTH_SHARED_TOKEN
      secretName: mistle-runtime
      secretKey: MISTLE_INTERNAL_AUTH_SHARED_TOKEN
    - name: MISTLE_SANDBOX_TOKENS_CONNECT_SECRET
      secretName: mistle-runtime
      secretKey: MISTLE_SANDBOX_TOKENS_CONNECT_SECRET
    - name: MISTLE_SANDBOX_TOKENS_BOOTSTRAP_SECRET
      secretName: mistle-runtime
      secretKey: MISTLE_SANDBOX_TOKENS_BOOTSTRAP_SECRET
    - name: MISTLE_POSTGRES_CONTROL_PLANE_POOLED_URL
      secretName: mistle-runtime
      secretKey: MISTLE_POSTGRES_CONTROL_PLANE_POOLED_URL
    - name: MISTLE_POSTGRES_CONTROL_PLANE_DIRECT_URL
      secretName: mistle-runtime
      secretKey: MISTLE_POSTGRES_CONTROL_PLANE_DIRECT_URL
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_SECRET
      secretName: mistle-runtime
      secretKey: MISTLE_SERVICES_CONTROL_PLANE_API_AUTH_SECRET
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_INTEGRATIONS_MASTER_ENCRYPTION_KEYS_JSON
      secretName: mistle-runtime
      secretKey: MISTLE_SERVICES_CONTROL_PLANE_API_INTEGRATIONS_MASTER_ENCRYPTION_KEYS_JSON

controlPlaneWorker:
  image:
    repository: control-plane-worker
    digest: sha256:replace-with-control-plane-worker-digest
  env:
    - name: NODE_ENV
      value: production
    - name: MISTLE_TELEMETRY_ENABLED
      value: "true"
    - name: MISTLE_TELEMETRY_DEBUG
      value: "false"
    - name: MISTLE_TELEMETRY_TRACES_ENDPOINT
      value: http://otel-collector:4318/v1/traces
    - name: MISTLE_TELEMETRY_LOGS_ENDPOINT
      value: http://otel-collector:4318/v1/logs
    - name: MISTLE_TELEMETRY_METRICS_ENDPOINT
      value: http://otel-collector:4318/v1/metrics
    - name: MISTLE_TELEMETRY_RESOURCE_ATTRIBUTES
      value: deployment.environment=production
    - name: MISTLE_WORKFLOW_CONTROL_PLANE_NAMESPACE_ID
      value: production
    - name: MISTLE_SERVICES_CONTROL_PLANE_WORKER_WORKFLOW_CONCURRENCY
      value: "4"
    - name: MISTLE_EMAIL_SMTP_FROM_ADDRESS
      value: no-reply@example.com
    - name: MISTLE_EMAIL_SMTP_FROM_NAME
      value: Mistle
    - name: MISTLE_EMAIL_SMTP_HOST
      value: smtp.resend.com
    - name: MISTLE_EMAIL_SMTP_PORT
      value: "587"
    - name: MISTLE_EMAIL_SMTP_SECURE
      value: "false"
    - name: MISTLE_SERVICES_DATA_PLANE_API_INTERNAL_URL
      value: http://mistle-data-plane-api:8082
    - name: MISTLE_SERVICES_CONTROL_PLANE_API_INTERNAL_URL
      value: http://mistle-control-plane-api:8080
  secretEnv:
    - name: MISTLE_POSTGRES_CONTROL_PLANE_POOLED_URL
      secretName: mistle-runtime
      secretKey: MISTLE_POSTGRES_CONTROL_PLANE_POOLED_URL
    - name: MISTLE_EMAIL_SMTP_USERNAME
      secretName: mistle-runtime
      secretKey: MISTLE_EMAIL_SMTP_USERNAME
    - name: MISTLE_EMAIL_SMTP_PASSWORD
      secretName: mistle-runtime
      secretKey: MISTLE_EMAIL_SMTP_PASSWORD

