[global]
env = "development"

[telemetry]
enabled = false
debug = false
resource_attributes = "deployment.environment=development"

[services.dashboard]
public_url = "http://localhost:3000"
control_plane_api_origin = "http://localhost:8080"

[services.control_plane_api]
host = "0.0.0.0"
port = 5100
public_url = "http://localhost:8080"
internal_url = "http://control-plane-api:5100"

[services.control_plane_api.auth]
secret = "replace-with-auth-secret"
trusted_origins = ["http://localhost:3000", "http://127.0.0.1:3000"]
enabled_methods = ["otp"]

[services.control_plane_api.auth.otp]
length = 6
expires_in_seconds = 300
allowed_attempts = 3

[services.control_plane_api.integrations]
active_master_encryption_key_version = 1

[services.control_plane_api.integrations.master_encryption_keys]
1 = "replace-with-integration-master-key"

[services.data_plane_api]
host = "0.0.0.0"
port = 5200
internal_url = "http://data-plane-api:5200"

[services.data_plane_gateway]
host = "0.0.0.0"
port = 5202
internal_url = "http://data-plane-gateway:5202"
sandbox_ws_public_url = "ws://localhost:8084/tunnel/sandbox"
sandbox_ws_internal_url = "ws://data-plane-gateway:5202/tunnel/sandbox"

[services.tokenizer_proxy]
host = "0.0.0.0"
port = 5205
public_url = "http://localhost:8080"
internal_url = "http://tokenizer-proxy:5205"
egress_url = "http://tokenizer-proxy:5205/tokenizer-proxy/egress"

[services.control_plane_worker]
workflow_concurrency = 1

[services.data_plane_worker]
workflow_concurrency = 1

[workflow.control_plane]
namespace_id = "local"

[workflow.data_plane]
namespace_id = "local"

[postgres.control_plane]
direct_url = "postgresql://mistle:mistle@postgres:5432/mistle_local"
pooled_url = "postgresql://mistle:mistle@postgres:5432/mistle_local"

[postgres.data_plane]
direct_url = "postgresql://mistle:mistle@postgres:5432/mistle_local"
pooled_url = "postgresql://mistle:mistle@postgres:5432/mistle_local"

[kv.control_plane]
backend = "valkey"
url = "redis://valkey:6379"
key_prefix = "mistle:control:local"

[kv.data_plane]
backend = "valkey"
url = "redis://valkey:6379"
key_prefix = "mistle:runtime-state:local"

[object_store.assets]
bucket_name = "mistle-assets"
region = "us-east-1"
endpoint = "http://seaweedfs:8333"
force_path_style = true
access_key_id = "mistle-access-key"
secret_access_key = "mistle-secret-key"

[object_store.sandbox_storage]
bucket_name = "mistle-sandbox-storage"
region = "us-east-1"
endpoint = "http://seaweedfs:8333"
force_path_style = true
access_key_id = "mistle-access-key"
secret_access_key = "mistle-secret-key"

[email.smtp]
from_address = "no-reply@mistle.local"
from_name = "Mistle (Local)"
host = "mailpit"
port = 1025
secure = false
username = "mailpit"
password = "mailpit"

[internal_auth]
method = "shared_token"

[internal_auth.shared_token]
token = "replace-with-service-token"

[sandbox]
provider = "docker"
default_base_image = "ghcr.io/mistlehq/sandbox-base:latest"
publish_base_domain = "mistle.localhost"

[sandbox.storage]
backend = "docker_volume"

[sandbox.tokens.connect]
secret = "replace-with-connect-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.tokens.bootstrap]
secret = "replace-with-bootstrap-token-secret"
issuer = "data-plane-worker"
audience = "data-plane-gateway"

[sandbox.tokens.egress]
secret = "replace-with-egress-token-secret"
issuer = "data-plane-worker"
audience = "tokenizer-proxy"

[sandbox.publish.access_token]
secret = "replace-with-publish-access-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.publish.session]
cookie_signing_secret = "replace-with-publish-cookie-signing-secret"

[sandbox.docker]
socket_path = "/var/run/docker.sock"
network_name = "mistle-sandbox-local"

[sandbox.storage.docker_volume]
name_prefix = "mistle-local-"
