name: ${MISTLE_COMPOSE_PROJECT_NAME}

x-docker-build: &docker-build
  context: ../../..
  dockerfile: docker/Dockerfile

x-mistle-runtime-environment: &mistle-runtime-environment
  MISTLE_CONFIG_PATH: /app/config/mistle.toml

x-mistle-local-config-volume: &mistle-local-config-volume
  type: bind
  source: ./config/config.local.toml
  target: /app/config/mistle.toml
  read_only: true

x-mistle-local-provision-manifest-volume: &mistle-local-provision-manifest-volume
  type: bind
  source: ./config/integration-targets.provision.json
  target: /app/deploy/compose/local/config/integration-targets.provision.json
  read_only: true

x-mistle-local-app: &mistle-local-app
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume

x-mistle-local-bootstrap: &mistle-local-bootstrap
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume
    - *mistle-local-provision-manifest-volume
  restart: "no"

x-mistle-local-migration-job: &mistle-local-migration-job
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume
  restart: "no"

services:
  dashboard:
    build:
      <<: *docker-build
      target: dashboard-runtime
    image: mistle/dashboard:local
    environment:
      MISTLE_DASHBOARD_CONTROL_PLANE_API_ORIGIN: ${MISTLE_DASHBOARD_CONTROL_PLANE_API_ORIGIN}
      MISTLE_DASHBOARD_AUTH_METHOD_GOOGLE: ${MISTLE_DASHBOARD_AUTH_METHOD_GOOGLE}
    env_file:
      - ${MISTLE_LOCAL_ENV_FILE:-./.env}
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3000:80"

  control-plane-api:
    build:
      <<: *docker-build
      target: control-plane-api-runtime
    image: mistle/control-plane-api:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-db-migrate:
        condition: service_completed_successfully
      control-plane-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5100/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:5100"

  control-plane-worker:
    build:
      <<: *docker-build
      target: control-plane-worker-runtime
    image: mistle/control-plane-worker:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
      sandbox-base-publish:
        condition: service_completed_successfully
      control-plane-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app

  data-plane-api:
    build:
      <<: *docker-build
      target: data-plane-api-runtime
    image: mistle/data-plane-api:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      data-plane-db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5200/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - *mistle-local-config-volume
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-plane-gateway:
    build:
      <<: *docker-build
      target: data-plane-gateway-runtime
    image: mistle/data-plane-gateway:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      data-plane-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5202/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8084:5202"

  data-plane-worker:
    build:
      <<: *docker-build
      target: data-plane-worker-runtime
    image: mistle/data-plane-worker:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
      MISTLE_APPS_DATA_PLANE_WORKER_SANDBOX_DOCKER_NETWORK_NAME: ${MISTLE_SANDBOX_NETWORK_NAME}
      MISTLE_APPS_DATA_PLANE_WORKER_SANDBOX_STORAGE_DOCKER_VOLUME_NAME_PREFIX: ${MISTLE_SANDBOX_STORAGE_DOCKER_VOLUME_NAME_PREFIX}
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
      data-plane-gateway:
        condition: service_healthy
      tokenizer-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      sandbox-base-publish:
        condition: service_completed_successfully
      control-plane-bootstrap:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    volumes:
      - *mistle-local-config-volume
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /tmp
        target: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tokenizer-proxy:
    build:
      <<: *docker-build
      target: tokenizer-proxy-runtime
    image: mistle/tokenizer-proxy:local
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5205/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mistle_local
      POSTGRES_USER: mistle
      POSTGRES_PASSWORD: mistle
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

  sandbox-base-image:
    build:
      context: ../../..
      dockerfile: packages/sandboxd/Dockerfile
      target: sandbox-base
    image: localhost:5001/mistle/sandbox-base:local
    entrypoint:
      - sh
      - -lc
    command:
      - echo "sandbox base image ready"
    restart: "no"

  sandbox-base-publish:
    image: docker:28-cli
    env_file:
      - ${MISTLE_LOCAL_ENV_FILE:-./.env}
    entrypoint:
      - sh
      - -lc
    command:
      - >
        docker image inspect "${MISTLE_GLOBAL_SANDBOX_DEFAULT_BASE_IMAGE}" >/dev/null &&
        attempts=0 &&
        until docker push "${MISTLE_GLOBAL_SANDBOX_DEFAULT_BASE_IMAGE}";
        do
          attempts=$$((attempts + 1));
          if [ "$$attempts" -ge 30 ]; then
            exit 1;
          fi;
          sleep 1;
        done
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    depends_on:
      registry:
        condition: service_started
      sandbox-base-image:
        condition: service_completed_successfully
    restart: "no"

  seaweedfs:
    image: chrislusf/seaweedfs:4.17_full
    environment:
      AWS_ACCESS_KEY_ID: mistle-access-key
      AWS_SECRET_ACCESS_KEY: mistle-secret-key
    command:
      - server
      - -ip=0.0.0.0
      - -dir=/data
      - -s3
    restart: unless-stopped
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - app

  registry:
    image: registry:3
    restart: unless-stopped
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - app
    ports:
      - "5001:5000"

  object-store-bootstrap:
    <<: *mistle-local-bootstrap
    image: mistle/control-plane-api:local
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - pnpm
      - tsx
      - scripts/dev/ensure-object-store-bucket.ts
    environment:
      DEV_OBJECT_STORE_ACCESS_KEY_ID: mistle-access-key
      DEV_OBJECT_STORE_SECRET_ACCESS_KEY: mistle-secret-key
      DEV_OBJECT_STORE_ENDPOINT: http://seaweedfs:8333
      DEV_OBJECT_STORE_BUCKET_NAME: mistle-assets
      DEV_OBJECT_STORE_PORT: "8333"
    networks:
      - app

  control-plane-db-migrate:
    <<: *mistle-local-migration-job
    image: mistle/control-plane-api:local
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/control-plane-api"
      - db:migrate
    environment:
      <<: *mistle-runtime-environment
    networks:
      - app

  data-plane-db-migrate:
    <<: *mistle-local-migration-job
    image: mistle/data-plane-api:local
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/data-plane-api"
      - db:migrate
    environment:
      <<: *mistle-runtime-environment
    networks:
      - app

  control-plane-bootstrap:
    <<: *mistle-local-bootstrap
    image: mistle/control-plane-api:local
    depends_on:
      control-plane-db-migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/control-plane-api"
      - integration-targets:sync
    environment:
      <<: *mistle-runtime-environment
      MISTLE_INTEGRATION_TARGETS_PROVISION_MANIFEST_PATH: /app/deploy/compose/local/config/integration-targets.provision.json
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    networks:
      - app
    ports:
      - "8025:8025"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:
  registry-data:

networks:
  app:
  sandbox:
    name: ${MISTLE_SANDBOX_NETWORK_NAME}
