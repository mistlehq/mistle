name: ${MISTLE_COMPOSE_PROJECT_NAME}

services:
  mistle:
    image: ${MISTLE_DOCKER_IMAGE}
    platform: linux/amd64
    env_file:
      - ${MISTLE_LOCAL_ENV_FILE:-./.env}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    volumes:
      - mistle-data:/var/lib/mistle
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test:
        - CMD-SHELL
        - >
          wget -q -O /dev/null http://127.0.0.1:3000/ &&
          wget -q -O /dev/null http://127.0.0.1:5100/__healthz &&
          wget -q -O /dev/null http://127.0.0.1:5202/__healthz &&
          wget -q -O /dev/null http://127.0.0.1:5205/__healthz
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3000:3000"
      - "5100:5100"
      - "5202:5202"
      - "5205:5205"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mistle_local
      POSTGRES_USER: mistle
      POSTGRES_PASSWORD: mistle
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.17_full
    environment:
      AWS_ACCESS_KEY_ID: mistle-access-key
      AWS_SECRET_ACCESS_KEY: mistle-secret-key
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
    restart: unless-stopped
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.28
    command:
      - --smtp-auth-accept-any
      - --smtp-auth-allow-insecure
    restart: unless-stopped
    networks:
      - app
    ports:
      - "8025:8025"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mistle-data:
  postgres-data:
  valkey-data:
  seaweedfs-data:

networks:
  app:
  sandbox:
    name: ${MISTLE_SANDBOX_NETWORK_NAME}
