name: ${MISTLE_COMPOSE_PROJECT_NAME}

x-mistle-runtime-environment: &mistle-runtime-environment
  MISTLE_CONFIG_PATH: /app/config/mistle.toml

x-mistle-local-config-volume: &mistle-local-config-volume
  type: bind
  source: ./config/config.local.toml
  target: /app/config/mistle.toml
  read_only: true

x-mistle-local-integration-targets-manifest-volume:
  &mistle-local-integration-targets-manifest-volume
  type: bind
  source: ../../../integration-targets.json
  target: /app/integration-targets.json
  read_only: true

x-mistle-local-app: &mistle-local-app
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume

x-mistle-local-bootstrap: &mistle-local-bootstrap
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume
    - *mistle-local-integration-targets-manifest-volume
  restart: "no"

x-mistle-local-migration-job: &mistle-local-migration-job
  env_file:
    - ${MISTLE_LOCAL_ENV_FILE:-./.env}
  volumes:
    - *mistle-local-config-volume
  restart: "no"

services:
  dashboard:
    build:
      context: ../../..
      dockerfile: docker/Dockerfile
      target: dashboard-runtime
      args:
        MISTLE_CONFIG_PATH: /app/deploy/compose/local/config/config.local.toml
    image: mistle/dashboard:local
    env_file:
      - ${MISTLE_LOCAL_ENV_FILE:-./.env}
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3000:80"

  control-plane-api:
    image: ghcr.io/mistlehq/control-plane-api:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      control-plane-db-migrate:
        condition: service_completed_successfully
      control-plane-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5100/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8080:5100"

  control-plane-worker:
    image: ghcr.io/mistlehq/control-plane-worker:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
      control-plane-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app

  data-plane-api:
    image: ghcr.io/mistlehq/data-plane-api:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
      data-plane-db-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5200/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - *mistle-local-config-volume
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"

  data-plane-gateway:
    image: ghcr.io/mistlehq/data-plane-gateway:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      data-plane-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5202/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8084:5202"

  data-plane-worker:
    image: ghcr.io/mistlehq/data-plane-worker:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
      MISTLE_APPS_DATA_PLANE_WORKER_SANDBOX_DOCKER_NETWORK_NAME: ${MISTLE_SANDBOX_NETWORK_NAME}
      MISTLE_APPS_DATA_PLANE_WORKER_SANDBOX_STORAGE_DOCKER_VOLUME_NAME_PREFIX: ${MISTLE_SANDBOX_STORAGE_DOCKER_VOLUME_NAME_PREFIX}
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
      data-plane-gateway:
        condition: service_healthy
      tokenizer-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
      control-plane-bootstrap:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app
    volumes:
      - *mistle-local-config-volume
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: /tmp
        target: /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"

  tokenizer-proxy:
    image: ghcr.io/mistlehq/tokenizer-proxy:${MISTLE_IMAGE_TAG}
    pull_policy: always
    <<: *mistle-local-app
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5205/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mistle_local
      POSTGRES_USER: mistle
      POSTGRES_PASSWORD: mistle
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:4.17_full
    environment:
      AWS_ACCESS_KEY_ID: mistle-access-key
      AWS_SECRET_ACCESS_KEY: mistle-secret-key
    command:
      - server
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -dir=/data
      - -s3
    restart: unless-stopped
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8333/status || exit 1
      interval: 2s
      timeout: 2s
      retries: 30
    networks:
      - app

  object-store-bootstrap:
    image: chrislusf/seaweedfs:4.17_full
    pull_policy: always
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint:
      - sh
      - -lc
    command:
      - >
        printf 's3.bucket.create -name mistle-assets\nexit\n' |
        weed shell -master=seaweedfs:9333
    networks:
      - app
    restart: "no"

  control-plane-db-migrate:
    <<: *mistle-local-migration-job
    image: ghcr.io/mistlehq/control-plane-api:${MISTLE_IMAGE_TAG}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/control-plane-api"
      - db:migrate
    environment:
      <<: *mistle-runtime-environment
    networks:
      - app

  data-plane-db-migrate:
    <<: *mistle-local-migration-job
    image: ghcr.io/mistlehq/data-plane-api:${MISTLE_IMAGE_TAG}
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/data-plane-api"
      - db:migrate
    environment:
      <<: *mistle-runtime-environment
    networks:
      - app

  control-plane-bootstrap:
    <<: *mistle-local-bootstrap
    image: ghcr.io/mistlehq/control-plane-api:${MISTLE_IMAGE_TAG}
    pull_policy: always
    depends_on:
      control-plane-db-migrate:
        condition: service_completed_successfully
      object-store-bootstrap:
        condition: service_completed_successfully
    entrypoint:
      - pnpm
      - --filter
      - "@mistle/control-plane-api"
      - integration-targets:sync
    environment:
      <<: *mistle-runtime-environment
      MISTLE_INTEGRATION_TARGETS_MANIFEST_PATH: /app/integration-targets.json
    networks:
      - app

  mailpit:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    networks:
      - app
    ports:
      - "8025:8025"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8025/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:
  seaweedfs-data:

networks:
  app:
  sandbox:
    name: ${MISTLE_SANDBOX_NETWORK_NAME}
