name: ${MISTLE_COMPOSE_PROJECT_NAME}

x-docker-build: &docker-build
  context: ../../..
  dockerfile: docker/Dockerfile

x-mistle-runtime-environment: &mistle-runtime-environment
  MISTLE_CONFIG_PATH: /app/config/mistle.toml

services:
  dashboard:
    build:
      <<: *docker-build
      target: dashboard-runtime
    image: mistle/dashboard:local
    environment:
      MISTLE_DASHBOARD_CONTROL_PLANE_API_ORIGIN: ${MISTLE_DASHBOARD_CONTROL_PLANE_API_ORIGIN}
      MISTLE_DASHBOARD_AUTH_METHOD_GOOGLE: ${MISTLE_DASHBOARD_AUTH_METHOD_GOOGLE}
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/ || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane-api:
    build:
      <<: *docker-build
      target: control-plane-api-runtime
    image: mistle/control-plane-api:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5100/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane-worker:
    build:
      <<: *docker-build
      target: control-plane-worker-runtime
    image: mistle/control-plane-worker:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  data-plane-api:
    build:
      <<: *docker-build
      target: data-plane-api-runtime
    image: mistle/data-plane-api:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5200/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  data-plane-gateway:
    build:
      <<: *docker-build
      target: data-plane-gateway-runtime
    image: mistle/data-plane-gateway:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      data-plane-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5202/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  data-plane-worker:
    build:
      <<: *docker-build
      target: data-plane-worker-runtime
    image: mistle/data-plane-worker:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
      data-plane-api:
        condition: service_healthy
      data-plane-gateway:
        condition: service_healthy
      tokenizer-proxy:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app

  tokenizer-proxy:
    build:
      <<: *docker-build
      target: tokenizer-proxy-runtime
    image: mistle/tokenizer-proxy:local
    environment:
      <<: *mistle-runtime-environment
    depends_on:
      control-plane-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app
      - sandbox
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:5205/__healthz || exit 1
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: mistle_local
      POSTGRES_USER: mistle
      POSTGRES_PASSWORD: mistle
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20

  valkey:
    image: valkey/valkey:9.0-alpine
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    networks:
      - app
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  valkey-data:

networks:
  app:
  sandbox:
