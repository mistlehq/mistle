name: CI - System (Scheduled)

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system:
    name: Scheduled System
    runs-on: ubuntu-latest
    timeout-minutes: 420
    outputs:
      docker-result: ${{ steps.results.outputs.docker-result }}
      e2b-result: ${{ steps.results.outputs.e2b-result }}
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-system-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-system-
            ${{ runner.os }}-turbo-${{ github.workflow }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies in Nix shell
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.11
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /integration-tests

      - name: Prepare scheduled system runtime
        run: nix develop --command bash -lc "pnpm --filter @mistle/tests test:system:prepare"

      - name: Run Docker scheduled system suite
        id: system-docker
        continue-on-error: true
        run: |
          nix develop --command bash -lc \
            "MISTLE_TEST_SYSTEM_SANDBOX_PROVIDER=docker pnpm --filter @mistle/tests test:system:run"

      - name: Run E2B scheduled system suite
        id: system-e2b
        if: ${{ always() && !cancelled() && steps.system-docker.outcome != 'skipped' }}
        continue-on-error: true
        run: |
          nix develop --command bash -lc \
            "MISTLE_TEST_SYSTEM_SANDBOX_PROVIDER=e2b pnpm --filter @mistle/tests test:system:run"

      - name: Record scheduled system results
        id: results
        if: always()
        run: |
          docker_result="${{ steps.system-docker.outcome }}"
          e2b_result="${{ steps.system-e2b.outcome }}"
          {
            echo "SYSTEM_DOCKER_RESULT=${docker_result}"
            echo "SYSTEM_E2B_RESULT=${e2b_result}"
          } >> "${GITHUB_ENV}"
          {
            echo "docker-result=${docker_result}"
            echo "e2b-result=${e2b_result}"
          } >> "${GITHUB_OUTPUT}"
          {
            echo "### Scheduled system results"
            echo
            echo "| Provider | Result |"
            echo "| --- | --- |"
            echo "| docker | ${docker_result} |"
            echo "| e2b | ${e2b_result} |"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-system-${{ github.sha }}

      - name: Fail on scheduled system suite failure
        if: always()
        run: |
          if [ "${SYSTEM_DOCKER_RESULT}" != "success" ] || [ "${SYSTEM_E2B_RESULT}" != "success" ]; then
            echo "Scheduled system suite failed. docker=${SYSTEM_DOCKER_RESULT} e2b=${SYSTEM_E2B_RESULT}" >&2
            exit 1
          fi

  sandbox-base-linux:
    name: Sandbox Base Image (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Linux sandbox base packaging check
        run: |
          docker build \
            --platform linux/amd64 \
            --target sandbox-base \
            --tag mistle-sandbox-base-check:local \
            --file packages/sandboxd/Dockerfile \
            .

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - system
      - sandbox-base-linux
    if: always()
    env:
      SYSTEM_RESULT: ${{ needs.system.result }}
      SYSTEM_DOCKER_RESULT: ${{ needs.system.outputs.docker-result }}
      SYSTEM_E2B_RESULT: ${{ needs.system.outputs.e2b-result }}
      SANDBOX_BASE_RESULT: ${{ needs.sandbox-base-linux.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.11
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          system_result = os.environ["SYSTEM_RESULT"]
          sandbox_base_result = os.environ["SANDBOX_BASE_RESULT"]
          if system_result == "success" and sandbox_base_result == "success":
              result = "success"
          elif system_result == "cancelled" or sandbox_base_result == "cancelled":
              result = "cancelled"
          else:
              result = "failure"
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
          }
          color = color_by_result.get(result, "#808080")
          emoji = emoji_by_result.get(result, ":grey_question:")
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Scheduled system run finished with result: {result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                          {
                              "title": "Docker",
                              "value": os.environ["SYSTEM_DOCKER_RESULT"] or os.environ["SYSTEM_RESULT"],
                              "short": True,
                          },
                          {
                              "title": "E2B",
                              "value": os.environ["SYSTEM_E2B_RESULT"] or os.environ["SYSTEM_RESULT"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
