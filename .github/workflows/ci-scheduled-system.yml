name: CI - System (Scheduled)

on:
  schedule:
    - cron: "0 0,6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: scheduled-system-${{ github.ref }}
  cancel-in-progress: false

jobs:
  system-runtime:
    name: Scheduled Runtime System
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
          source-url: https://github.com/DeterminateSystems/magic-nix-cache/releases/download/v0.1.6/magic-nix-cache-X64-Linux

      - name: Restore pnpm store cache
        id: pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-system-runtime-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-system-runtime-
            ${{ runner.os }}-turbo-${{ github.workflow }}-
            ${{ runner.os }}-turbo-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /integration-tests

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker,e2b pnpm run config:init:integration"

      - name: Build runtime system test dependencies
        run: >-
          nix develop --command pnpm turbo run build --output-logs=errors-only
          --filter=@mistle/tests^...
          --filter=@mistle/control-plane-api...
          --filter=@mistle/control-plane-worker...
          --filter=@mistle/data-plane-api...
          --filter=@mistle/data-plane-gateway...
          --filter=@mistle/data-plane-worker...

      - name: Login to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build local sandbox base image
        run: >-
          nix develop --command pnpm sandbox-base:build
          --provider docker
          --output-image-ref mistle/sandbox-base:dev
          --publish-mode load
          --platform linux/amd64
          --target sandbox-base-system-tests

      - name: Run runtime system tests
        run: nix develop --command pnpm --filter @mistle/tests test:system:runtime

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-system-runtime-${{ github.sha }}

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - system-runtime
    if: always()
    env:
      SYSTEM_RUNTIME_RESULT: ${{ needs.system-runtime.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ["SYSTEM_RUNTIME_RESULT"]
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
              "skipped": "#808080",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
              "skipped": ":white_circle:",
          }
          color = color_by_result.get(result, "#808080")
          emoji = emoji_by_result.get(result, ":grey_question:")
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Scheduled runtime system run finished with result: {result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
