name: Publish Sandbox Base Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-sandbox-base.yml"
      - ".dockerignore"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/sandbox-base/build-provider-image.ts"
      - "scripts/test/ensure-system-test-sandbox-base-image.ts"
      - "packages/sandbox/**"
      - "packages/sandboxd/**"
      - "packages/test-harness/src/system/system-test-sandbox-base-image.ts"
      - "tests/system/fixtures/vite-dev-server/**"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also publish the latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-sandbox-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Sandbox Base Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/mistlehq/sandbox-base
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_LATEST_TAG: latest
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 25
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build sandbox base image
        run: |
          args=(
            --output-image-ref "${IMAGE_REPOSITORY}:${IMAGE_TAG}"
            --platform linux/amd64
            --target sandbox-base
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}"
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"
            --label "org.opencontainers.image.title=Mistle Sandbox Base"
            --label "org.opencontainers.image.description=Sandbox base image for Mistle coding agent runtimes"
            --label "org.opencontainers.image.url=${IMAGE_SOURCE}"
            --label "org.opencontainers.image.vendor=Mistle"
          )

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish_latest }}" = "true" ]; then
            args+=(--additional-output-image-ref "${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}")
          fi

          pnpm dev:sandbox-base:push:docker "${args[@]}"

      - name: Resolve pushed digest
        id: publish
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE_REPOSITORY}:${IMAGE_TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          image_ref="${IMAGE_REPOSITORY}@${digest}"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Summarize published image
        run: |
          {
            echo "## Published image"
            echo
            echo "- Tag: \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish_latest }}" = "true" ]; then
              echo "- Alias: \`${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}\`"
            fi
            echo "- Digest: \`${{ steps.publish.outputs.image_ref }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-system-test:
    name: Publish System Test Sandbox Base Image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 25
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Publish system test sandbox base image
        id: publish-system-test
        run: |
          image_ref="$(NODE_OPTIONS='--conditions workspace-src' pnpm exec tsx ./scripts/test/ensure-system-test-sandbox-base-image.ts)"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          echo "Resolved system test sandbox base image: ${image_ref}"

      - name: Summarize published system test image
        run: |
          {
            echo "## Published system test image"
            echo
            echo "- Tag: \`${{ steps.publish-system-test.outputs.image_ref }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - publish
      - publish-system-test
    if: always()
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_RESULT: ${{ needs.publish.result }}
      SYSTEM_TEST_PUBLISH_RESULT: ${{ needs.publish-system-test.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          publish_result = os.environ["PUBLISH_RESULT"]
          system_test_publish_result = os.environ["SYSTEM_TEST_PUBLISH_RESULT"]
          notification_result = (
              "failure"
              if "failure" in (publish_result, system_test_publish_result)
              else "cancelled"
              if "cancelled" in (publish_result, system_test_publish_result)
              else "success"
              if publish_result == "success" and system_test_publish_result == "success"
              else "unknown"
          )
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
          }
          color = color_by_result.get(notification_result, "#808080")
          emoji = emoji_by_result.get(notification_result, ":grey_question:")
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Sandbox base image publish finished with result: {publish_result}; system test image result: {system_test_publish_result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
