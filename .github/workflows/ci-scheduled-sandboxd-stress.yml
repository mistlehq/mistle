name: CI - Sandboxd Stress (Scheduled)

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      stress_cases:
        description: "Comma-separated sandboxd stress case names"
        required: false
        default: ""
        type: string
      stress_multiplier:
        description: "Positive integer multiplier for default stress counts"
        required: false
        default: "4"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: scheduled-sandboxd-stress-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sandboxd-stress:
    name: Scheduled Sandboxd Stress
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Restore sandboxd container cargo cache
        id: sandboxd-stress-container-cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/sandboxd-test/cargo-home
          key: ${{ runner.os }}-sandboxd-test-cargo-home-${{ hashFiles('packages/sandboxd/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sandboxd-test-cargo-home-

      - name: Restore pnpm store cache
        id: sandboxd-stress-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies in Nix shell
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.sandboxd-stress-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -lc "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Build sandboxd test runner image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/sandboxd/Dockerfile.test
          tags: mistle/sandboxd-test-runner:ci
          load: true
          cache-from: type=gha,scope=sandboxd-test-runner
          cache-to: type=gha,mode=max,scope=sandboxd-test-runner

      - name: Run sandboxd stress tests in Nix shell
        env:
          MISTLE_SANDBOXD_STRESS_CASES: ${{ inputs.stress_cases || '' }}
          MISTLE_SANDBOXD_STRESS_MULTIPLIER: ${{ inputs.stress_multiplier || '4' }}
          MISTLE_SANDBOXD_TEST_IMAGE: mistle/sandboxd-test-runner:ci
          MISTLE_SANDBOXD_TEST_RUNNER_BUILD_POLICY: never
        run: nix develop --command pnpm --filter @mistle/sandboxd test:stress

      - name: Save sandboxd container cargo cache
        if: steps.sandboxd-stress-container-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/sandboxd-test/cargo-home
          key: ${{ runner.os }}-sandboxd-test-cargo-home-${{ hashFiles('packages/sandboxd/Cargo.lock') }}

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - sandboxd-stress
    if: always()
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      SANDBOXD_STRESS_RESULT: ${{ needs.sandboxd-stress.result }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.11
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          result = os.environ["SANDBOXD_STRESS_RESULT"]
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
          }
          color = color_by_result.get(result, "#808080")
          emoji = emoji_by_result.get(result, ":grey_question:")
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Scheduled sandboxd stress run finished with result: {result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
