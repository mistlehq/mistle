  test-commit-sign:
    name: Commit Sign Test
    # runs-on: blacksmith-2vcpu-ubuntu-2404
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.commit_sign == 'true'
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Nix directories
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: Mount Nix sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore commit-sign container cargo cache
        id: test-commit-sign-container-cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/commit-sign-test/cargo-home
          key: ${{ runner.os }}-commit-sign-test-cargo-home-${{ hashFiles('packages/commit-sign/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-commit-sign-test-cargo-home-

      - name: Restore commit-sign container target cache
        id: test-commit-sign-container-target-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/commit-sign-test/target-alpine-container
          key: ${{ runner.os }}-commit-sign-test-target-alpine-${{ hashFiles('packages/commit-sign/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-commit-sign-test-target-alpine-${{ hashFiles('packages/commit-sign/Cargo.lock') }}-
            ${{ runner.os }}-commit-sign-test-target-alpine-

      - name: Restore pnpm store cache
        id: test-commit-sign-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.test-commit-sign-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Setup Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "10240"

      - name: Build commit-sign test runner image
        run: >-
          docker buildx build
          --load
          --pull=false
          --tag "mistle/commit-sign-test-runner:dockerfile-${{ hashFiles('packages/commit-sign/Dockerfile.test') }}"
          --file packages/commit-sign/Dockerfile.test
          packages/commit-sign

      - name: Run commit-sign tests in Nix shell
        env:
          MISTLE_COMMIT_SIGN_TEST_IMAGE: mistle/commit-sign-test-runner:dockerfile-${{ hashFiles('packages/commit-sign/Dockerfile.test') }}
          MISTLE_COMMIT_SIGN_TEST_RUNNER_BUILD_POLICY: never
        run: nix develop --command pnpm --filter @mistle/commit-sign test

      - name: Save commit-sign container cargo cache
        if: steps.test-commit-sign-container-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/commit-sign-test/cargo-home
          key: ${{ runner.os }}-commit-sign-test-cargo-home-${{ hashFiles('packages/commit-sign/Cargo.lock') }}

      - name: Save commit-sign container target cache
        if: ${{ always() && !cancelled() && steps.test-commit-sign-container-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .local/commit-sign-test/target-alpine-container
          key: ${{ runner.os }}-commit-sign-test-target-alpine-${{ hashFiles('packages/commit-sign/Cargo.lock') }}-${{ github.sha }}

  test-sandboxd:
    name: Sandboxd Test
    # runs-on: blacksmith-2vcpu-ubuntu-2404
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.sandboxd == 'true'
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Nix directories
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: Mount Nix sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore sandboxd container cargo cache
        id: test-sandboxd-container-cargo-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/sandboxd-test/cargo-home
          key: ${{ runner.os }}-sandboxd-test-cargo-home-${{ hashFiles('packages/sandboxd/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-sandboxd-test-cargo-home-

      - name: Restore sandboxd container target cache
        id: test-sandboxd-container-target-cache
        uses: actions/cache/restore@v5
        with:
          path: .local/sandboxd-test/target-debian-container
          key: ${{ runner.os }}-sandboxd-test-target-debian-${{ hashFiles('packages/sandboxd/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sandboxd-test-target-debian-${{ hashFiles('packages/sandboxd/Cargo.lock') }}-
            ${{ runner.os }}-sandboxd-test-target-debian-

      - name: Restore pnpm store cache
        id: test-sandboxd-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.test-sandboxd-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Setup Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "20480"

      - name: Build sandboxd test runner image
        run: >-
          docker buildx build
          --load
          --pull=false
          --tag "mistle/sandboxd-test-runner:dockerfile-${{ hashFiles('packages/sandboxd/Dockerfile.test') }}"
          --file packages/sandboxd/Dockerfile.test
          packages/sandboxd

      - name: Run sandboxd tests in Nix shell
        env:
          MISTLE_SANDBOXD_TEST_IMAGE: mistle/sandboxd-test-runner:dockerfile-${{ hashFiles('packages/sandboxd/Dockerfile.test') }}
          MISTLE_SANDBOXD_TEST_RUNNER_BUILD_POLICY: never
        run: nix develop --command pnpm --filter @mistle/sandboxd test

      - name: Run sandboxd integration tests in Nix shell
        env:
          MISTLE_SANDBOXD_TEST_IMAGE: mistle/sandboxd-test-runner:dockerfile-${{ hashFiles('packages/sandboxd/Dockerfile.test') }}
          MISTLE_SANDBOXD_TEST_RUNNER_BUILD_POLICY: never
        run: nix develop --command pnpm --filter @mistle/sandboxd test:integration

      - name: Save sandboxd container cargo cache
        if: steps.test-sandboxd-container-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .local/sandboxd-test/cargo-home
          key: ${{ runner.os }}-sandboxd-test-cargo-home-${{ hashFiles('packages/sandboxd/Cargo.lock') }}

      - name: Save sandboxd container target cache
        if: ${{ always() && !cancelled() && steps.test-sandboxd-container-target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .local/sandboxd-test/target-debian-container
          key: ${{ runner.os }}-sandboxd-test-target-debian-${{ hashFiles('packages/sandboxd/Cargo.lock') }}-${{ github.sha }}

  sandbox-base-linux:
    name: Sandbox Base Image (Linux)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 90
    needs:
      - changes
    if: needs.changes.outputs.sandbox_base_linux == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "20480"

      - name: Run Linux sandbox base packaging check
        run: |
          docker buildx build \
            --load \
            --platform linux/amd64 \
            --target sandbox-base-tooling \
            --tag mistle-sandbox-base-tooling-check:local \
            --file packages/sandboxd/Dockerfile \
            .

      - name: Verify sandbox base login shell PATH
        run: |
          docker run --rm --platform linux/amd64 --entrypoint bash mistle-sandbox-base-tooling-check:local -lc '
            set -euo pipefail
            for tool in cmddir docker dockerd mise nix node python3; do
              command -v "$tool"
            done
          '

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - changes
      - static-ts
      - static-rust
      - test-ts
      - test-ts-component
      - test-commit-sign
      - test-sandboxd
      - sandbox-base-linux
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
      CHANGES_RESULT: ${{ needs.changes.result }}
      TS_STATIC_RESULT: ${{ needs.static-ts.result }}
      RUST_STATIC_RESULT: ${{ needs.static-rust.result }}
      TS_TEST_RESULT: ${{ needs.test-ts.result }}
      TS_COMPONENT_TEST_RESULT: ${{ needs.test-ts-component.result }}
      COMMIT_SIGN_TEST_RESULT: ${{ needs.test-commit-sign.result }}
      SANDBOXD_TEST_RESULT: ${{ needs.test-sandboxd.result }}
      SANDBOX_BASE_RESULT: ${{ needs.sandbox-base-linux.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.11
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          changes_result = os.environ["CHANGES_RESULT"]
          lane_results = [
              os.environ["TS_STATIC_RESULT"],
              os.environ["RUST_STATIC_RESULT"],
              os.environ["TS_TEST_RESULT"],
              os.environ["TS_COMPONENT_TEST_RESULT"],
              os.environ["COMMIT_SIGN_TEST_RESULT"],
              os.environ["SANDBOXD_TEST_RESULT"],
          ]
          sandbox_base_result = os.environ["SANDBOX_BASE_RESULT"]
          success_like_results = {"success", "skipped"}
          if changes_result == "cancelled":
              workflow_result = "cancelled"
          elif changes_result != "success":
              workflow_result = "failure"
          elif all(result in success_like_results for result in lane_results) and sandbox_base_result in success_like_results:
              workflow_result = "success"
          elif any(result == "cancelled" for result in [*lane_results, sandbox_base_result]):
              workflow_result = "cancelled"
          else:
              workflow_result = "failure"

          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":white_circle:",
          }
          color = color_by_result.get(workflow_result, "#808080")
          emoji = emoji_by_result.get(workflow_result, ":grey_question:")
          pr_field = {
              "title": "Commit",
              "value": f"`{os.environ['GITHUB_SHA'][:7]}`",
              "short": False,
          }
          api_request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/commits/{os.environ['GITHUB_SHA']}/pulls",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="GET",
          )
          try:
              with urllib.request.urlopen(api_request) as response:
                  pull_requests = json.load(response)
          except urllib.error.HTTPError:
              pull_requests = []

          if pull_requests:
              pull_request = pull_requests[0]
              pr_field = {
                  "value": f"<{pull_request['html_url']}|#{pull_request['number']} {pull_request['title']}>",
                  "short": False,
              }

          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": "PR merged to main",
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} CI run finished with result: {workflow_result}.",
                      "mrkdwn_in": ["text", "fields"],
                      "fields": [
                          pr_field,
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
