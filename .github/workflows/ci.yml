        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore pnpm store cache
        id: test-ts-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: test-ts-turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-test-ts-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-test-ts-
            ${{ runner.os }}-turbo-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.test-ts-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Run TS tests in Nix shell
        run: >-
          nix develop --command pnpm turbo run test --output-logs=full
          --filter=!@mistle/sandboxd --filter=!@mistle/commit-sign

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.test-ts-turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-test-ts-${{ github.sha }}

