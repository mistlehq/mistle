name: CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect CI lane changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ts_static: ${{ steps.filter.outputs.ts_static }}
      ts_build: ${{ steps.filter.outputs.ts_build }}
      ts_test: ${{ steps.filter.outputs.ts_test }}
      ts_component: ${{ steps.filter.outputs.ts_component }}
      rust_static: ${{ steps.filter.outputs.rust_static }}
      commit_sign: ${{ steps.filter.outputs.commit_sign }}
      sandboxd: ${{ steps.filter.outputs.sandboxd }}
      sandbox_base_linux: ${{ steps.filter.outputs.sandbox_base_linux }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            ts_static:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '!packages/sandboxd/**'
            ts_build:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '!packages/commit-sign/**'
              - '!packages/docs/**'
              - '!packages/sandboxd/**'
            ts_test:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'apps/**'
              - 'packages/**'
              - 'tests/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - '!packages/commit-sign/**'
              - '!packages/docs/**'
              - '!packages/sandboxd/**'
            ts_component:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'apps/dashboard/**'
              - 'packages/config/**'
              - 'packages/http/**'
              - 'packages/integrations-core/**'
              - 'packages/integrations-definitions/**'
              - 'packages/sandbox-session-client/**'
              - 'packages/sandbox-session-protocol/**'
              - 'packages/time/**'
              - 'packages/ui/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
            rust_static:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'packages/commit-sign/**'
              - 'packages/sandboxd/**'
              - 'packages/sandbox-runtime-contract/**'
              - 'packages/integrations-core/**'
              - 'packages/integrations-definitions/**'
              - 'packages/sandbox-session-protocol/**'
              - 'packages/time/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
            commit_sign:
              - '.github/workflows/ci.yml'
              - '.envrc'
              - 'packages/commit-sign/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            sandboxd:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.envrc'
              - 'packages/sandboxd/**'
              - 'packages/sandbox-runtime-contract/**'
              - 'packages/integrations-core/**'
              - 'packages/integrations-definitions/**'
              - 'packages/sandbox-session-protocol/**'
              - 'packages/time/**'
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
            sandbox_base_linux:
              - '.github/workflows/ci.yml'
              - '.github/workflows/ci-scheduled-integration.yml'
              - '.github/workflows/ci-scheduled-sandboxd-stress.yml'
              - '.github/workflows/ci-scheduled-system.yml'
              - '.dockerignore'
              - 'packages/sandboxd/Dockerfile'
              - 'packages/sandboxd/scripts/cmddir'

  static-ts:
    name: TS Static
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.ts_static == 'true'
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Nix directories
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: Mount Nix sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore pnpm store cache
        id: static-ts-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: static-ts-turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-static-ts-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-static-ts-
            ${{ runner.os }}-turbo-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.static-ts-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Run TS static checks in Nix shell
        run: >-
          nix develop --command bash -c
          "pnpm exec oxfmt --check --threads=4 . &&
          pnpm exec oxlint --type-aware --deny-warnings --threads=4 apps packages tests &&
          pnpm lint:openapi &&
          pnpm lint:docs &&
          pnpm lint:sql &&
          pnpm typecheck:ts"

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.static-ts-turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-static-ts-${{ github.sha }}

  build-ts:
    name: TS Build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.ts_build == 'true'
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Nix directories
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: Mount Nix sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore pnpm store cache
        id: build-ts-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: build-ts-turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-build-ts-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-build-ts-
            ${{ runner.os }}-turbo-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.build-ts-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Build TS workspace in Nix shell
        run: nix develop --command bash -c "MISTLE_CONFIG_PATH=$GITHUB_WORKSPACE/config/config.integration.docker.toml pnpm build:ts"

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.build-ts-turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-build-ts-${{ github.sha }}

  static-rust:
    name: Rust Static
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.rust_static == 'true'
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Nix directories
        run: |
          sudo mkdir -p /nix/store
          sudo chmod -R 777 /nix

      - name: Mount Nix sticky disk
        uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-nix-store-single-user-${{ runner.os }}-${{ github.job }}
          path: /nix

      - name: Prepare single-user Nix store
        run: |
          sudo mkdir -p /nix/store
          sudo chown "$USER:$USER" /nix /nix/store

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: sandbox-rust
          workspaces: |
            packages/commit-sign -> target
            packages/sandboxd -> target
          env-vars: AR CARGO CC CFLAGS CMAKE CXX DEVELOPER_DIR HOST_PATH LD MACOSX_DEPLOYMENT_TARGET NIX NM RANLIB RUST SDKROOT
          cmd-format: nix develop --command {0}

      - name: Restore pnpm store cache
        id: static-rust-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Restore Turbo local cache
        id: static-rust-turbo-cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-static-rust-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.workflow }}-static-rust-
            ${{ runner.os }}-turbo-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Save pnpm store cache
        if: steps.static-rust-pnpm-store-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Build workspace in Nix shell
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: nix develop --command bash -c "MISTLE_CONFIG_PATH=$GITHUB_WORKSPACE/config/config.integration.docker.toml pnpm turbo run build --filter=@mistle/sandboxd"

      - name: Run Rust static checks in Nix shell
        run: >-
          nix develop --command bash -c
          "pnpm --filter @mistle/sandboxd format:check &&
          pnpm --filter @mistle/commit-sign format:check &&
          pnpm turbo run lint typecheck --output-logs=full --concurrency=2 --filter=@mistle/sandboxd --filter=@mistle/commit-sign"

      - name: Save Turbo local cache
        if: ${{ always() && !cancelled() && steps.static-rust-turbo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ github.workflow }}-static-rust-${{ github.sha }}

  knip:
    name: Knip
    # runs-on: blacksmith-2vcpu-ubuntu-2404
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          install_options: --no-daemon

      - name: Set up Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ""
          source-url: https://github.com/DeterminateSystems/magic-nix-cache/releases/download/v0.1.6/magic-nix-cache-X64-Linux

      - name: Restore pnpm store cache
        id: knip-pnpm-store-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Materialize Nix shell
        run: nix develop --command true

      - name: Install pnpm dependencies
        run: nix develop --command pnpm install --frozen-lockfile

      - name: Generate integration config
        run: nix develop --command bash -c "MISTLE_TEST_SANDBOX_INTEGRATION_PROVIDERS=docker pnpm run config:init:integration"

      - name: Run knip in Nix shell
        run: nix develop --command pnpm lint:knip

  test-ts:
    name: TS Test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 60
    needs:
      - changes
    if: needs.changes.outputs.ts_test == 'true'
    env:
      CI: true
      TURBO_TELEMETRY_DISABLED: "1"
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
