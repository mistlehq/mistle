name: Publish Single Container Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-single-container-image.yml"
      - "docker/Dockerfile.single"
      - "docker/apps/**"
      - "docker/single/**"
      - "apps/control-plane-api/**"
      - "apps/control-plane-worker/**"
      - "apps/dashboard/**"
      - "apps/data-plane-api/**"
      - "apps/data-plane-worker/**"
      - "apps/data-plane-gateway/**"
      - "apps/tokenizer-proxy/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      profile:
        description: Single-container profile image to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - docker
          - e2b
      publish_latest:
        description: Also publish profile-qualified latest tags
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-single-container-image-${{ github.ref }}-${{ inputs.profile }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare publish matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      publish_latest: ${{ steps.flags.outputs.publish_latest }}
      selected_profile: ${{ steps.flags.outputs.selected_profile }}

    steps:
      - name: Resolve publish flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "publish_latest=false" >> "${GITHUB_OUTPUT}"
            echo "selected_profile=all" >> "${GITHUB_OUTPUT}"
          else
            echo "publish_latest=${{ inputs.publish_latest }}" >> "${GITHUB_OUTPUT}"
            echo "selected_profile=${{ inputs.profile }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve matrix
        id: matrix
        env:
          SELECTED_PROFILE: ${{ steps.flags.outputs.selected_profile }}
        run: |
          python3 <<'PY'
          import json
          import os

          all_profiles = [
              {"profile": "docker", "target": "docker-sandbox"},
              {"profile": "e2b", "target": "remote-sandbox"},
          ]
          selected_profile = os.environ["SELECTED_PROFILE"]

          if selected_profile == "all":
              selected = all_profiles
          else:
              selected = [
                  profile
                  for profile in all_profiles
                  if profile["profile"] == selected_profile
              ]

          if not selected:
              raise RuntimeError(f"Unsupported profile selection: {selected_profile}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"matrix={json.dumps(selected)}\n")
          PY

  publish:
    name: Publish ${{ matrix.profile }}
    needs:
      - prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      IMAGE_REPOSITORY: ghcr.io/mistlehq/mistle
      IMAGE_TAG: ${{ matrix.profile }}-${{ github.sha }}
      IMAGE_LATEST_TAG: ${{ matrix.profile }}-latest
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      IMAGE_TARGET: ${{ matrix.target }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push single-container image
        id: publish
        run: |
          tags=(--tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}")
          metadata_file="$(mktemp)"

          if [ "${{ needs.prepare.outputs.publish_latest }}" = "true" ]; then
            tags+=(--tag "${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}")
          fi

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target "${IMAGE_TARGET}" \
            --file docker/Dockerfile.single \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=mistle-${{ matrix.profile }}" \
            "${tags[@]}" \
            --metadata-file "${metadata_file}" \
            --push \
            .

          METADATA_FILE="${metadata_file}" python3 <<'PY'
          import json
          import os

          metadata_path = os.environ["METADATA_FILE"]
          with open(metadata_path, encoding="utf-8") as fh:
              metadata = json.load(fh)

          digest = metadata.get("containerimage.digest")
          if not isinstance(digest, str) or not digest:
              raise RuntimeError("Buildx metadata did not include containerimage.digest.")

          image_repository = os.environ["IMAGE_REPOSITORY"]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"image_ref={image_repository}@{digest}\n")
          PY

      - name: Summarize published image
        run: |
          {
            echo "## Published image"
            echo
            echo "- Profile: \`${{ matrix.profile }}\`"
            echo "- Tag: \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            if [ "${{ needs.prepare.outputs.publish_latest }}" = "true" ]; then
              echo "- Alias: \`${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}\`"
            fi
            echo "- Digest: \`${{ steps.publish.outputs.image_ref }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - prepare
      - publish
    if: always()
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}
      SELECTED_PROFILE: ${{ needs.prepare.outputs.selected_profile }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@v1.0.11
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          publish_result = os.environ["PUBLISH_RESULT"]
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
          }
          color = color_by_result.get(publish_result, "#808080")
          emoji = emoji_by_result.get(publish_result, ":grey_question:")
          profile = os.environ["SELECTED_PROFILE"]
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Single-container image publish finished with result: {publish_result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                          {
                              "title": "Profile",
                              "value": profile,
                              "short": True,
                          },
                          {
                              "title": "Trigger",
                              "value": os.environ["GITHUB_EVENT_NAME"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
