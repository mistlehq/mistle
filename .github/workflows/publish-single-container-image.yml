name: Publish Single Container Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-single-container-image.yml"
      - "docker/Dockerfile.single"
      - "docker/apps/**"
      - "docker/single/**"
      - "apps/control-plane-api/**"
      - "apps/control-plane-worker/**"
      - "apps/dashboard/**"
      - "apps/data-plane-api/**"
      - "apps/data-plane-worker/**"
      - "apps/data-plane-gateway/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
  workflow_dispatch:
    inputs:
      publish_latest:
        description: Also publish latest tag
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-single-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish single-container
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/mistlehq/mistle
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_LATEST_TAG: latest
      IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
      IMAGE_TARGET: single-container

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build single-container image
        run: |
          tags=(--tag "${IMAGE_REPOSITORY}:${IMAGE_TAG}")

          publish_latest="${{ github.event_name == 'push' || inputs.publish_latest }}"
          if [ "${publish_latest}" = "true" ]; then
            tags+=(--tag "${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}")
          fi

          docker build \
            --platform linux/amd64 \
            --target "${IMAGE_TARGET}" \
            --file docker/Dockerfile.single \
            --label "org.opencontainers.image.source=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.title=Mistle" \
            --label "org.opencontainers.image.description=Open-source platform for running sandboxed coding agents" \
            --label "org.opencontainers.image.url=${IMAGE_SOURCE}" \
            --label "org.opencontainers.image.vendor=Mistle" \
            "${tags[@]}" \
            .

      - name: Push single-container image
        run: |
          docker push "${IMAGE_REPOSITORY}:${IMAGE_TAG}"

          publish_latest="${{ github.event_name == 'push' || inputs.publish_latest }}"
          if [ "${publish_latest}" = "true" ]; then
            docker push "${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}"
          fi

      - name: Resolve pushed digest
        id: publish
        run: |
          image_ref="$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_REPOSITORY}:${IMAGE_TAG}")"
          echo "image_ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Summarize published image
        run: |
          {
            echo "## Published image"
            echo
            echo "- Tag: \`${IMAGE_REPOSITORY}:${IMAGE_TAG}\`"
            publish_latest="${{ github.event_name == 'push' || inputs.publish_latest }}"
            if [ "${publish_latest}" = "true" ]; then
              echo "- Alias: \`${IMAGE_REPOSITORY}:${IMAGE_LATEST_TAG}\`"
            fi
            echo "- Digest: \`${{ steps.publish.outputs.image_ref }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  notify:
    name: Notify Slack
    runs-on: ubuntu-latest
    needs:
      - publish
    if: always()
    permissions:
      contents: read
      id-token: write
    env:
      PUBLISH_RESULT: ${{ needs.publish.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      WORKFLOW_NAME: ${{ github.workflow }}

    steps:
      - name: Fetch Infisical secrets
        uses: Infisical/secrets-action@77ab1f4ccd183a543cb5b42435fbd181189f4995 # v1.0.16
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: mistle-oss
          env-slug: ci
          secret-path: /ci-shared

      - name: Post Slack notification
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request

          publish_result = os.environ["PUBLISH_RESULT"]
          color_by_result = {
              "success": "#2eb886",
              "failure": "#e01e5a",
              "cancelled": "#ecb22e",
          }
          emoji_by_result = {
              "success": ":white_check_mark:",
              "failure": ":x:",
              "cancelled": ":warning:",
          }
          color = color_by_result.get(publish_result, "#808080")
          emoji = emoji_by_result.get(publish_result, ":grey_question:")
          payload = {
              "attachments": [
                  {
                      "color": color,
                      "title": os.environ["WORKFLOW_NAME"],
                      "title_link": os.environ["RUN_URL"],
                      "text": f"{emoji} Single-container image publish finished with result: {publish_result}.",
                      "fields": [
                          {
                              "title": "Repository",
                              "value": os.environ["GITHUB_REPOSITORY"],
                              "short": True,
                          },
                          {
                              "title": "Branch",
                              "value": os.environ["GITHUB_REF_NAME"],
                              "short": True,
                          },
                          {
                              "title": "Trigger",
                              "value": os.environ["GITHUB_EVENT_NAME"],
                              "short": True,
                          },
                      ],
                  }
              ]
          }
          request = urllib.request.Request(
              os.environ["SLACK_WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 200:
                  raise RuntimeError(f"Slack webhook returned unexpected status {response.status}.")
          PY
