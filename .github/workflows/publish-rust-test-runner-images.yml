name: Publish Rust Test Runner Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-rust-test-runner-images.yml"
      - "packages/commit-sign/Dockerfile.test"
      - "packages/sandboxd/Dockerfile.test"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-rust-test-runner-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: commit-sign test runner
            dockerfile: packages/commit-sign/Dockerfile.test
            image_repository: ghcr.io/mistlehq/commit-sign-test-runner
            cache_scope: commit-sign-test-runner
          - name: sandboxd test runner
            dockerfile: packages/sandboxd/Dockerfile.test
            image_repository: ghcr.io/mistlehq/sandboxd-test-runner
            cache_scope: sandboxd-test-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve image tag
        id: image
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_REPOSITORY: ${{ matrix.image_repository }}
        run: |
          dockerfile_hash="$(node -e "const { createHash } = require('node:crypto'); const { readFileSync } = require('node:fs'); const fileHash = createHash('sha256').update(readFileSync(process.env.DOCKERFILE)).digest(); process.stdout.write(createHash('sha256').update(fileHash).digest('hex'));")"
          image_tag="dockerfile-${dockerfile_hash}"
          image_ref="${IMAGE_REPOSITORY}:${image_tag}"

          echo "tag=${image_tag}" >> "${GITHUB_OUTPUT}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Summarize published image
        run: |
          {
            echo "## Published image"
            echo
            echo "- Image: \`${{ steps.image.outputs.ref }}\`"
            echo "- Dockerfile: \`${{ matrix.dockerfile }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
