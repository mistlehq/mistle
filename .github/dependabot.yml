version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/tests/system/fixtures/vite-dev-server"
    schedule:
      interval: daily
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: "/packages/commit-sign"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: "/packages/mstl-core"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: "/packages/mstl-cli"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: gomod
    directory: "/packages/sandboxd"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
    cooldown:
      default-days: 7
