version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    versioning-strategy: increase
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: npm
    directory: "/tests/system/fixtures/vite-dev-server"
    schedule:
      interval: daily
    versioning-strategy: increase
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: cargo
    directory: "/packages/sandboxd"
    schedule:
      interval: daily
    ignore:
      # tracing-opentelemetry 0.32.x still depends on the 0.31 OpenTelemetry crates.
      # Remove these ignores once the tracing bridge supports opentelemetry 0.32.
      - dependency-name: "opentelemetry"
        versions: [">=0.32.0, <0.33.0"]
      - dependency-name: "opentelemetry_sdk"
        versions: [">=0.32.0, <0.33.0"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: cargo
    directory: "/packages/commit-sign"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: chore(deps)
