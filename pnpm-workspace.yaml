packages:
  - apps/*
  - packages/*
  - tests

enableGlobalVirtualStore: true

# 3 days = 4320 minutes.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@opencode-ai/sdk@1.16.2"
  - "tensorlake@0.5.31"

allowBuilds:
  "@parcel/watcher": false
  "@prisma/engines": false
  core-js: false
  cpu-features: false
  esbuild: true
  lefthook: true
  msgpackr-extract: false
  prisma: false
  protobufjs: false
  puppeteer: false
  sharp: false
  squawk-cli: true
  ssh2: false

overrides:
  "@aws-sdk/xml-builder": "3.972.22"
  "@prisma/dev>@hono/node-server": "1.19.13"
  "@prisma/dev>hono": "4.12.18"
  "@protobufjs/utf8": "1.1.1"
  axios: "1.16.0"
  basic-ftp: "5.3.1"
  body-parser: "1.20.3"
  "brace-expansion@2.0.2": "2.0.3"
  cookie: "0.7.0"
  defu: "6.1.5"
  "dockerode>protobufjs": "7.5.8"
  "@effect/platform-node-shared>effect": "4.0.0-beta.70"
  effect: "3.20.0"
  "react-doctor>effect": "4.0.0-beta.70"
  esbuild: "0.25.0"
  express: "4.20.0"
  fast-uri: "3.1.2"
  fast-xml-builder: "1.2.0"
  hono: "4.12.23"
  ip-address: "10.1.1"
  "js-yaml@4.1.0": "4.1.1"
  js-cookie: "3.0.6"
  kysely: "0.28.17"
  lodash: "4.18.0"
  lodash-es: "4.18.0"
  mermaid: "11.15.0"
  "mermaid>dompurify": "3.4.0"
  "minimatch@3.1.2": "3.1.4"
  "minimatch@5.1.6": "5.1.9"
  path-to-regexp: "0.1.13"
  "picomatch@4.0.3": "4.0.4"
  postcss: "8.5.10"
  "protobufjs@<8.0.0": "7.5.8"
  "protobufjs@>=8.0.0 <8.2.0": "8.2.0"
  qs: "6.15.2"
  react-router: "7.15.0"
  react-router-dom: "7.15.0"
  send: "0.19.0"
  tar: "7.5.13"
  tmp: "0.2.6"
  uuid: "11.1.1"
  "uuid@11.1.0": "11.1.1"
  ws: "8.21.0"
  yaml: "2.8.3"
  "zod@3.21.4": "3.22.3"

packageExtensions:
  drizzle-kit@*:
    peerDependencies:
      drizzle-orm: "*"
  "@phosphor-icons/react@*":
    peerDependencies:
      "@types/react": "*"
  "@rjsf/core@*":
    dependencies:
      "@rjsf/validator-ajv8": "~6.5.1"
  "@mintlify/link-rot@*":
    dependencies:
      react: "^19.0.0"
  "@mintlify/scraping@*":
    dependencies:
      openapi-types: "12.1.3"
  "@testing-library/jest-dom@*":
    dependencies:
      vitest: "^4.1.5"
  langium@*:
    dependencies:
      "@chevrotain/regexp-to-ast": "11.1.2"
      "@chevrotain/types": "11.1.2"
      vscode-jsonrpc: "8.2.0"
      vscode-languageserver-protocol: "3.17.5"
      vscode-languageserver-types: "3.17.5"
  input-otp@*:
    peerDependencies:
      "@types/react": "*"
  next-themes@*:
    peerDependencies:
      "@types/react": "*"

patchedDependencies:
  "@mintlify/previewing@4.0.1016": "patches/@mintlify__previewing@4.0.1016.patch"
