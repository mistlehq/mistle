# Prefilled for E2B sandbox deployments. Replace each value that begins with "replace-with-".

[global]
env = "production"

[telemetry]
enabled = false
debug = false
resource_attributes = "deployment.environment=production"

[services.dashboard]
public_url = "https://replace-with-dashboard-public-host"
control_plane_api_origin = "same-origin"

[services.control_plane_api]
host = "0.0.0.0"
port = 5100
public_url = "https://replace-with-control-plane-api-public-host"
internal_url = "http://127.0.0.1:5100"

[services.control_plane_api.auth]
secret = "replace-with-control-plane-auth-secret"
trusted_origins = ["https://replace-with-dashboard-public-host"]
enabled_methods = ["otp"]

[services.control_plane_api.auth.otp]
length = 6
expires_in_seconds = 300
allowed_attempts = 3

[services.control_plane_api.integrations]
active_master_encryption_key_version = 1

[services.control_plane_api.integrations.master_encryption_keys]
"1" = "replace-with-master-encryption-key"

[services.data_plane_api]
host = "127.0.0.1"
port = 5200
internal_url = "http://127.0.0.1:5200"

[services.data_plane_gateway]
host = "0.0.0.0"
port = 5202
internal_url = "http://127.0.0.1:5202"
sandbox_ws_public_url = "wss://replace-with-data-plane-gateway-public-host/tunnel/sandbox"
sandbox_ws_internal_url = "wss://replace-with-data-plane-gateway-public-host/tunnel/sandbox"

[services.tokenizer_proxy]
host = "0.0.0.0"
port = 5205
public_url = "https://replace-with-tokenizer-proxy-public-host"
internal_url = "http://127.0.0.1:5205"
egress_url = "https://replace-with-tokenizer-proxy-public-host/tokenizer-proxy/egress"

[services.control_plane_worker]
workflow_concurrency = 4

[services.data_plane_worker]
workflow_concurrency = 4

[workflow.control_plane]
namespace_id = "production"

[workflow.data_plane]
namespace_id = "production"

[postgres.control_plane]
direct_url = "postgresql://replace-with-postgres-user:replace-with-postgres-password@replace-with-postgres-host:5432/replace-with-control-plane-database"
pooled_url = "postgresql://replace-with-postgres-user:replace-with-postgres-password@replace-with-pgbouncer-host:6432/replace-with-control-plane-database"

[postgres.data_plane]
direct_url = "postgresql://replace-with-postgres-user:replace-with-postgres-password@replace-with-postgres-host:5432/replace-with-data-plane-database"
pooled_url = "postgresql://replace-with-postgres-user:replace-with-postgres-password@replace-with-pgbouncer-host:6432/replace-with-data-plane-database"

[kv.control_plane]
backend = "valkey"
url = "redis://replace-with-valkey-host:6379"
key_prefix = "mistle:control"

[kv.data_plane]
backend = "valkey"
url = "redis://replace-with-valkey-host:6379"
key_prefix = "mistle:runtime-state"

[object_store.assets]
bucket_name = "replace-with-object-store-bucket"
region = "replace-with-object-store-region"
endpoint = "https://replace-with-object-store-endpoint"
force_path_style = true
access_key_id = "replace-with-object-store-access-key-id"
secret_access_key = "replace-with-object-store-secret-access-key"

[object_store.sandbox_storage]
bucket_name = "replace-with-sandbox-storage-bucket"
region = "replace-with-sandbox-storage-region"
endpoint = "https://replace-with-sandbox-storage-endpoint"
force_path_style = true
access_key_id = "replace-with-sandbox-storage-access-key-id"
secret_access_key = "replace-with-sandbox-storage-secret-access-key"

[email.smtp]
from_address = "replace-with-email-from-address"
from_name = "Mistle"
host = "replace-with-smtp-host"
port = 587
secure = false
username = "replace-with-smtp-username"
password = "replace-with-smtp-password"

[internal_auth]
method = "shared_token"

[internal_auth.shared_token]
token = "replace-with-internal-service-token"

[sandbox]
provider = "e2b"
default_base_image = "replace-with-sandbox-base-image"
publish_base_domain = "replace-with-sandbox-publish-base-domain"

[sandbox.storage]
backend = "archil"

[sandbox.storage.archil]
api_key = "replace-with-archil-api-key"
region = "replace-with-archil-region"
name_prefix = "mistle-"
mount_object_store = "sandbox_storage"

[sandbox.e2b]
api_key = "replace-with-e2b-api-key"
domain = "e2b.app"
cpu_count = 4
memory_mb = 8192

[sandbox.tokens.connect]
secret = "replace-with-connect-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.tokens.bootstrap]
secret = "replace-with-bootstrap-token-secret"
issuer = "data-plane-worker"
audience = "data-plane-gateway"

[sandbox.tokens.egress]
secret = "replace-with-egress-token-secret"
issuer = "data-plane-worker"
audience = "tokenizer-proxy"

[sandbox.publish.access_token]
secret = "replace-with-publish-access-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.publish.session]
cookie_signing_secret = "replace-with-publish-session-cookie-signing-secret"
