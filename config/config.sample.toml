# Full reference of config keys.
# This sample is production-centric.

[global]
env = "production"

[telemetry]
enabled = true
debug = false
resource_attributes = "deployment.environment=production"

[telemetry.traces]
endpoint = "http://otel-collector:4318/v1/traces"

[telemetry.logs]
endpoint = "http://otel-collector:4318/v1/logs"

[telemetry.metrics]
endpoint = "http://otel-collector:4318/v1/metrics"

[services.dashboard]
public_url = "https://app.mistle.example"
control_plane_api_origin = "https://api.mistle.example"

# Managed-cloud operator settings. Self-hosted deployments should leave these
# commented out.
#
#[services.dashboard.posthog]
#enabled = true
#project_api_key = "replace-with-posthog-project-api-key"
#host = "https://us.i.posthog.com"
#
#[billing.stripe]
#enabled = true
#secret_key = "replace-with-stripe-secret-key"

[services.control_plane_api]
host = "0.0.0.0"
port = 8080
public_url = "https://api.mistle.example"
internal_url = "http://control-plane-api:8080"
workflow_database_pool_max = 4

[services.control_plane_api.auth]
secret = "replace-with-strong-auth-secret"
trusted_origins = ["https://app.mistle.example"]
enabled_methods = ["otp"]
allow_signups = true

# Mistle Cloud only.
# [services.control_plane_api.auth.welcome_email]
# enabled = false
# Optional. When omitted, the welcome email does not include a booking link.
# call_url = "https://mistle-booking-link.com"

[services.control_plane_api.auth.otp]
length = 6
expires_in_seconds = 300
allowed_attempts = 3

# Required when enabled_methods includes "google".
#[services.control_plane_api.auth.google]
#client_id = "replace-with-google-client-id"
#client_secret = "replace-with-google-client-secret"

[services.control_plane_api.mcp]
url = "https://mcp.mistle.example/mcp"

[services.control_plane_api.mcp.auth]
secret = "replace-with-mcp-runtime-token-secret"
issuer = "control-plane-api"
audience = "mistle-mcp"

[services.control_plane_api.integrations]
active_master_encryption_key_version = 1

[services.control_plane_api.integrations.master_encryption_keys]
"1" = "replace-with-master-encryption-key"

[services.data_plane_api]
host = "0.0.0.0"
port = 8082
internal_url = "http://data-plane-api:8082"
workflow_database_pool_max = 4

[services.data_plane_gateway]
host = "0.0.0.0"
port = 8084
internal_url = "http://data-plane-gateway:8084"
sandbox_ws_public_url = "wss://gateway.mistle.example/tunnel/sandbox"
sandbox_ws_internal_url = "ws://data-plane-gateway:8084/tunnel/sandbox"

[services.control_plane_worker]
workflow_concurrency = 4
workflow_database_pool_max = 4

[services.data_plane_worker]
workflow_concurrency = 4
workflow_database_pool_max = 4

[workflow.control_plane]
namespace_id = "production"

[workflow.data_plane]
namespace_id = "production"

# Each plane can point at separate Postgres instances. For local and simple
# deployments, direct_url and pooled_url may still target the same database.
# Use direct_url for migrations and OpenWorkflow backends. Use pooled_url for
# normal app runtime queries.
[postgres.control_plane]
direct_url = "postgresql://mistle:replace-with-password@db:5432/mistle"
pooled_url = "postgresql://mistle:replace-with-password@pgbouncer:6432/mistle"

[postgres.data_plane]
direct_url = "postgresql://mistle:replace-with-password@db:5432/mistle"
pooled_url = "postgresql://mistle:replace-with-password@pgbouncer:6432/mistle"

# Valkey is modeled as a shared dependency. Services consume the plane-specific
# KV backend they need instead of owning duplicated Valkey config.
[kv.control_plane]
backend = "valkey"
url = "redis://valkey:6379"
key_prefix = "mistle:control"

[kv.data_plane]
backend = "valkey"
url = "redis://valkey:6379"
key_prefix = "mistle:runtime-state"

[gateway_relay]
backend = "memory"

# Required before running data-plane-gateway with more than one replica.
#[gateway_relay]
#backend = "nats"
#
#[gateway_relay.nats]
#url = "nats://nats:4222"
#name_prefix = "mistle-prod"

[object_store.assets]
bucket_name = "mistle-assets"
region = "us-east-1"
endpoint = "https://s3.example.com"
force_path_style = true
access_key_id = "replace-with-object-store-access-key"
secret_access_key = "replace-with-object-store-secret-key"

# Used when sandbox.storage.archil.mount_object_store = "sandbox_storage".
[object_store.sandbox_storage]
bucket_name = "mistle-sandbox-storage"
region = "us-east-1"
endpoint = "https://s3.example.com"
force_path_style = true
access_key_id = "replace-with-sandbox-storage-access-key"
secret_access_key = "replace-with-sandbox-storage-secret-key"

[email.smtp]
from_address = "no-reply@mistle.example"
from_name = "Mistle"
host = "smtp.mistle.example"
port = 587
secure = false
username = "replace-with-smtp-username"
password = "replace-with-smtp-password"

# Service-to-service auth is currently a shared token. The method field keeps
# the shape explicit if this later moves to signed workload identity/JWTs.
[internal_auth]
method = "shared_token"

[internal_auth.shared_token]
token = "replace-with-internal-service-token"

[sandbox]
default_base_image = "registry.example.com/mistle/sandbox-base:prod"
publish_base_domain = "mistle.example"

[sandbox.storage]
backend = "archil"

[sandbox.storage.archil]
api_key = "replace-with-archil-api-key"
# Region availability: https://docs.archil.com/reference/regions
region = "gcp-us-central1"
name_prefix = "mistle-"
mount_object_store = "sandbox_storage"

[sandbox.e2b]
enabled = true
api_key = "replace-with-e2b-api-key"
domain = "e2b.app"
cpu_count = 4
memory_mb = 8192

[sandbox.tensorlake]
enabled = true
api_key = "replace-with-tensorlake-api-key"

#[sandbox.docker]
#enabled = true
#socket_path = "/var/run/docker.sock"
#network_name = "mistle-sandbox"

# Required when sandbox.storage.backend = "docker_volume".
#[sandbox.storage.docker_volume]
#name_prefix = "mistle-"

[sandbox.tokens.connect]
secret = "replace-with-connect-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.tokens.bootstrap]
secret = "replace-with-bootstrap-token-secret"
issuer = "data-plane-worker"
audience = "data-plane-gateway"

[sandbox.tokens.egress]
secret = "replace-with-egress-token-secret"
issuer = "data-plane-gateway"
audience = "mistle-gateway-egress"

[sandbox.tokens.pty_transport]
secret = "replace-with-pty-token-secret"
issuer = "data-plane-gateway"
audience = "mistle-gateway-pty"

[sandbox.publish.access_token]
secret = "replace-with-publish-access-token-secret"
issuer = "control-plane-api"
audience = "data-plane-gateway"

[sandbox.publish.session]
cookie_signing_secret = "replace-with-publish-session-cookie-signing-secret"
