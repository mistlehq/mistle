[package]
name = "sandboxd"
version = "0.11.1"
edition = "2024"

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
futures-util = "0.3.31"
flate2 = "1.1.9"
http-body-util = { version = "0.1.3", features = ["channel"] }
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-rustls = { version = "0.27.9", features = ["http1", "native-tokio"] }
hyper-util = { version = "0.1.17", features = [
  "client",
  "client-legacy",
  "http1",
  "server",
  "tokio",
] }
nix = { version = "0.31.3", features = ["fs", "process", "signal", "socket", "user"] }
opentelemetry = { version = "0.31", features = ["trace"] }
opentelemetry_sdk = { version = "0.31", features = ["trace"] }
portable-pty = "0.9.0"
rcgen = "0.14.7"
reqwest = { version = "0.13.3", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
rustls-pki-types = { version = "1.14.1", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
tempfile = "3.27.0"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.52.3", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "rt-multi-thread",
  "sync",
] }
tokio-rustls = "0.26.4"
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.32.1"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "std"] }
tungstenite = "0.29.0"
url = "2.5.7"
