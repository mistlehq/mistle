[package]
name = "sandboxd"
version = "0.0.0"
edition = "2024"

[dependencies]
bytes = "1.10.1"
futures-util = "0.3.31"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["http1", "server"] }
hyper-rustls = { version = "0.27.7", features = ["http1", "native-tokio"] }
hyper-util = { version = "0.1.17", features = [
  "client",
  "client-legacy",
  "http1",
  "server",
  "tokio",
] }
nix = { version = "0.31.2", features = ["fs", "process", "signal", "socket", "user"] }
portable-pty = "0.9.0"
rcgen = "0.13.2"
rustls-pki-types = { version = "1.14.0", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.47.1", features = ["macros", "net", "rt", "rt-multi-thread", "sync"] }
tokio-rustls = "0.26.4"
tokio-tungstenite = "0.28.0"
tungstenite = "0.28.0"
url = "2.5.7"
