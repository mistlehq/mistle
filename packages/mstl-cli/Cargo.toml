[package]
name = "mstl-cli"
version = "0.32.0"
edition = "2024"

[[bin]]
name = "mistle"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
bpaf = "0.9.26"
futures-util = "0.3.31"
getrandom = "0.3.4"
mstl-core = { path = "../mstl-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-native-roots"] }
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
