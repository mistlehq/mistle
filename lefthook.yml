pre-commit:
  parallel: false
  commands:
    lint-staged:
      run: pnpm lint-staged

commit-msg:
  parallel: false
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    validate-changed:
      run: pnpm validate:changed --base origin/main --head HEAD
